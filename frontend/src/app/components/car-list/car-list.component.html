<div class="w-full flex flex-col gap-6">
  <!-- HEADER -->
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
        <i class="pi pi-car text-primary"></i>
        Available Cars
      </h2>
      <p class="text-sm text-gray-500">({{ filteredCars().length }}) results</p>
    </div>

    <!-- reset button moved to filter bar so it's inline with filters -->
  </div>

  <!-- FILTER BAR -->
  <div class="flex flex-wrap items-center gap-3">
    <!-- SORT -->
    <p-select
      [options]="[
        { label: 'Price: Low to High', value: 'priceAsc', icon: 'pi pi-sort-amount-up' },
        { label: 'Price: High to Low', value: 'priceDesc', icon: 'pi pi-sort-amount-down' },
        { label: 'Newest First', value: 'yearDesc', icon: 'pi pi-calendar' },
      ]"
      [ngModel]="sort()"
      (ngModelChange)="sort.set($event)"
      placeholder="Sort"
      class="w-56 h-10"
    >
      <ng-template pTemplate="selectedItem" let-option>
        <div class="flex items-center gap-2">
          <i [class]="option?.icon"></i>
          <span>{{ option?.label }}</span>
        </div>
      </ng-template>

      <ng-template pTemplate="item" let-option>
        <div class="flex items-center gap-2">
          <i [class]="option.icon"></i>
          <span>{{ option.label }}</span>
        </div>
      </ng-template>
    </p-select>

    <!-- BRAND -->
    <p-select
      [options]="brands()"
      [ngModel]="selectedBrand()"
      (ngModelChange)="selectedBrand.set($event)"
      placeholder="Brand"
      class="w-60 h-10"
      [filter]="true"
      filterPlaceholder="Search brands"
      filterBy="label"
    />

    <!-- YEAR -->
    <p-select
      [options]="years()"
      [ngModel]="selectedYear()"
      (ngModelChange)="selectedYear.set($event)"
      placeholder="Year"
      class="w-32 h-10"
    />

    <div class="ml-auto">
      <p-button
        label="Reset filters"
        icon="pi pi-refresh"
        severity="secondary"
        size="small"
        class="h-10"
        styleClass="h-10"
        (onClick)="resetFilters()"
        [disabled]="!filtersActive()"
        pTooltip="No filters to reset"
        [tooltipDisabled]="filtersActive()"
        tooltipPosition="top"
      />
    </div>

  </div>

  <!-- GRID -->
  @if (filteredCars().length) {
    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (car of filteredCars(); track car.id) {
        <div class="h-full">
          <app-car-card [car]="car"></app-car-card>
        </div>
      }
    </div>
  } @else {
    <!-- EMPTY -->
    <div class="flex flex-col items-center justify-center gap-4 bg-white rounded-xl p-8 h-80">
      <i class="pi pi-car text-4xl text-gray-400"></i>

      <p class="text-gray-700 font-medium text-lg">No cars match your filters.</p>
      <p class="text-sm text-gray-500">Try adjusting your filters or reset to see all available cars.</p>
    </div>
  }
</div>
