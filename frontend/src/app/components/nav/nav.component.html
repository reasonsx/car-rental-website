<nav class="sticky top-0 z-50 w-full bg-white shadow-md border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-2 sm:px-8 lg:px-12">
    <div class="flex items-center justify-between h-16">
      <!-- LEFT: BRAND -->
      <div class="flex items-center gap-4">
        <a
          routerLink="/"
          class="flex items-center gap-3 text-lg font-semibold text-gray-800"
        >
          <div
            class="flex h-10 w-10 items-center justify-center rounded-md bg-slate-900 text-white shadow-sm"
          >
            <i class="pi pi-car text-base"></i>
          </div>

          <span class="leading-none">Car Rental</span>
        </a>
      </div>

      <!-- CENTER/RIGHT: ACTIONS -->
      <div class="flex items-center">
        <!-- desktop actions -->
        <div class="hidden sm:flex items-center gap-3">
          @if (isAuthenticated()) {
            <span class="text-sm text-gray-600 hidden md:block">Welcome, {{ currentUser()?.name }}</span>

            <p-button routerLink="/profile" label="Profile" icon="pi pi-user" [text]="true" styleClass="text-sm" />

            @if (isAdmin()) {
              <p-button routerLink="/admin" label="Admin" icon="pi pi-cog" [text]="true" styleClass="text-sm" />
            }

            <p-button (onClick)="logout()" label="Logout" icon="pi pi-sign-out" severity="danger" styleClass="text-sm" />
          } @else {
            <p-button routerLink="/login" label="Login" icon="pi pi-sign-in" styleClass="text-sm" />
          }
        </div>

        <!-- mobile menu button -->
        <button
          class="sm:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:bg-gray-100"
          aria-expanded="false"
          (click)="menuOpen.set(!menuOpen())"
        >
          <i class="pi pi-bars text-xl"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- mobile menu -->
  <div *ngIf="menuOpen()" class="sm:hidden">
    <div class="px-4 pt-2 pb-3 space-y-1 bg-white border-t border-gray-100">
      @if (isAuthenticated()) {
        <div class="px-2 py-2 text-sm text-gray-700">Welcome, {{ currentUser()?.name }}</div>
        <p-button routerLink="/profile" label="Profile" icon="pi pi-user" [text]="true" styleClass="w-full text-left" (onClick)="menuOpen.set(false)" />

        @if (isAdmin()) {
          <p-button routerLink="/admin" label="Admin" icon="pi pi-cog" [text]="true" styleClass="w-full text-left" (onClick)="menuOpen.set(false)" />
        }

        <p-button (onClick)="logout()" label="Logout" icon="pi pi-sign-out" severity="danger" styleClass="w-full text-left" />
      } @else {
        <p-button routerLink="/login" label="Login" icon="pi pi-sign-in" styleClass="w-full text-left" (onClick)="menuOpen.set(false)" />
      }
    </div>
  </div>
</nav>
