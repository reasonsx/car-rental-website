<div class="min-h-screen bg-slate-50 py-8">
  <div class="mx-auto flex w-full max-w-7xl flex-col px-2 sm:px-8 lg:px-12">
        <div class="mb-6">
          <h1 class="text-3xl font-semibold text-slate-900">Admin dashboard</h1>
          <p class="mt-1 text-slate-600">Manage cars, users, bookings, categories, and pickup locations.</p>
        </div>


    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
      <p-tabs
        [value]="activeTab()"
        (valueChange)="onTabChange($event)"
        class="flex flex-col"
      >
        <div class="border-b border-slate-200 px-2 pt-2">
          <p-tablist class="overflow-x-auto">
            @for (tab of tabs; track tab.key) {
              <p-tab [value]="tab.key">
                <span class="inline-flex items-center gap-2 whitespace-nowrap">
                  <i [class]="tab.icon"></i>
                  {{ tab.label }}
                </span>
              </p-tab>
            }
          </p-tablist>
        </div>

        <p-tabpanels class="bg-white p-6">
          <p-tabpanel value="cars">
            <app-admin-cars />
          </p-tabpanel>

          <p-tabpanel value="users">
            <app-admin-users />
          </p-tabpanel>

          <p-tabpanel value="bookings">
            <app-admin-bookings />
          </p-tabpanel>

          <p-tabpanel value="categories">
            <app-admin-categories />
          </p-tabpanel>

          <p-tabpanel value="locations">
            <app-admin-locations />
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</div>
