<div class="h-screen flex flex-col bg-gray-50 p-6">
  <div class="flex flex-col flex-1 max-w-7xl mx-auto w-full">
    <h1 class="text-3xl font-semibold text-gray-900 mb-6">
      Admin Dashboard
    </h1>

    <p-tabs [(value)]="activeTab" class="flex flex-col flex-1 overflow-hidden">

      <p-tablist>
        @for (tab of tabs; track tab.key) {
          <p-tab [value]="tab.key">
            {{ tab.label }}
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels class="flex-1 overflow-hidden">

        <p-tabpanel value="cars" class="h-full">
          <app-admin-cars class="block h-full" />
        </p-tabpanel>

        <p-tabpanel value="users" class="h-full">
          <app-admin-users class="block h-full" />
        </p-tabpanel>

        <p-tabpanel value="bookings" class="h-full">
          <app-admin-bookings class="block h-full" />
        </p-tabpanel>

        <p-tabpanel value="categories" class="h-full">
          <app-admin-categories class="block h-full" />
        </p-tabpanel>

        <p-tabpanel value="locations" class="h-full">
          <app-admin-locations class="block h-full" />
        </p-tabpanel>

      </p-tabpanels>
    </p-tabs>
  </div>
</div>
