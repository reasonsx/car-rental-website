<div class="flex flex-col gap-6">
  <!-- HEADER -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Categories</h2>
      <p class="text-sm text-slate-500">Manage car categories</p>
    </div>
  </div>

  <!-- ALERTS -->
  @if (error()) {
    <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      {{ error() }}
    </div>
  }

  @if (success()) {
    <div class="rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
      {{ success() }}
    </div>
  }

  <!-- FORM -->
  <div class="flex flex-col gap-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div class="flex items-center justify-between">
      <h3 class="text-base font-medium text-slate-700">
        {{ selectedCategory() ? "Edit category" : "Create category" }}
      </h3>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">Category name</label>
        <input pInputText formControlName="name" placeholder="Enter category name" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">Description</label>
        <textarea
          pInputTextarea
          formControlName="description"
          rows="3"
          placeholder="Enter description (optional)"
        ></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-slate-200">
        <p-button *ngIf="selectedCategory()" label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
        <p-button
          type="submit"
          [label]="selectedCategory() ? 'Update category' : 'Create category'"
          icon="pi pi-save"
          [disabled]="form.invalid"
        />
      </div>
    </form>
  </div>

  <!-- TABLE -->
  <div class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div class="flex items-center justify-between">
      <h3 class="text-base font-medium text-slate-700">Categories list</h3>
      <span class="text-sm text-slate-500"> {{ categories().length }} items </span>
    </div>
    <div class="overflow-x-auto">
      <p-table
        [value]="categories()"
        [paginator]="true"
        [rows]="8"
        class="text-sm min-w-full"
        responsiveLayout="scroll"
        tableStyleClass="min-w-full"
      >
        <!-- HEADER -->
        <ng-template pTemplate="header">
          <tr class="border-b border-slate-200">
            <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Name</th>
            <th class="px-3 py-2 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Description</th>
            <th class="px-3 py-2 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">Actions</th>
          </tr>
        </ng-template>
        <!-- BODY -->
        <ng-template pTemplate="body" let-category>
          <tr class="transition hover:bg-slate-50">
            <td class="font-medium text-slate-800">
              {{ category.name }}
            </td>
            <td class="text-slate-600">
              {{ category.description || "—" }}
            </td>
            <td>
              <div class="flex justify-end gap-1">
                <p-button
                  icon="pi pi-pencil"
                  size="small"
                  [text]="true"
                  (onClick)="edit(category)"
                />
                <p-button
                  icon="pi pi-trash"
                  size="small"
                  severity="danger"
                  [text]="true"
                  (onClick)="remove(category.id)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
