<div class="w-full max-w-7xl mx-auto px-6 py-8 min-h-[calc(100vh-64px)]">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-semibold text-gray-800">
      Choose a location and browse cars
    </h1>
    <p class="text-sm text-gray-500 mt-2">
      Find the perfect car for your next trip
    </p>
  </div>

  @if (loading()) {
    <div class="flex flex-col items-center justify-center py-16 gap-4">
      <p-progressSpinner strokeWidth="4" />
      <span class="text-sm text-gray-500">Loading cars...</span>
    </div>
  } @else {
    <p-card class="mb-6 shadow-sm rounded-xl w-full">
      @if (locations().length === 0) {
        <p-skeleton height="3rem" class="w-full" />
      } @else {
        <app-location-selector
          [locations]="locations()"
          [selectedLocationId]="selectedLocationId() ?? undefined"
          (selectedLocationChange)="selectLocation($event)"
        />
      }
    </p-card>

    <p-card class="shadow-none border-0 w-full">
      <div class="p-0">
        @if (cars().length === 0) {
          <div class="flex flex-col items-center py-10 text-gray-500">
            No cars available
          </div>
        } @else {
          <app-car-list />
        }
      </div>
    </p-card>
  }
</div>
