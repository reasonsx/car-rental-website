<div class="min-h-screen bg-slate-50 py-8">
  <div class="mx-auto w-full max-w-7xl px-2 sm:px-8 lg:px-12">

    <!-- PAGE HEADER -->
    <div class="mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">
        Find your perfect car
      </h1>
      <p class="mt-2 text-slate-600">
        Choose a location and browse our available vehicles for your next trip
      </p>
    </div>

    <!-- LOCATION SELECTOR -->
    <div class="mb-6 rounded-lg border border-slate-200 bg-white shadow-sm">
      <div class="border-b border-slate-200 px-6 py-5">
        <h2 class="text-lg font-semibold text-slate-900">Select location</h2>
        <p class="mt-1 text-sm text-slate-600">Pick a location to view available cars</p>
      </div>

      <div class="p-6">
        @if (locations().length === 0) {
          <p-skeleton height="3rem" class="w-full" />
        } @else {
          <app-location-selector
            [locations]="locations()"
            [selectedLocationId]="selectedLocationId() ?? undefined"
            (selectedLocationChange)="selectLocation($event)"
          />
        }
      </div>
    </div>

    <!-- CAR LIST -->
    <div class="rounded-lg border border-slate-200 bg-white shadow-sm">
      <div class="border-b border-slate-200 px-6 py-5">
        <h2 class="text-lg font-semibold text-slate-900">Available cars</h2>
        <p class="mt-1 text-sm text-slate-600">Browse and select the perfect vehicle for your needs</p>
      </div>

      <div class="p-6">
        <app-car-list [selectedLocationId]="selectedLocationId()" />
      </div>
    </div>

  </div>
</div>
